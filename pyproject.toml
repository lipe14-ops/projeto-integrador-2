[project]
name = "codigo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Filipe Soares", email = "filipe.ns1001@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "cdsapi>=0.7.7",
    "cfgrib>=0.9.15.1",
    "dask>=2026.8.0",
    "eccodes>=2.48.0",
    "fastapi>=0.115.0",
    "geopandas>=1.1.4",
    "geoalchemy2>=0.17.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.30.0",
    "xarray>=2026.7.0",
    "lxml>=6.1.3",
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "numpy>=2.0.0",
    "plotly>=7.1.0",
]

[project.scripts]
codigo = "codigo.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
